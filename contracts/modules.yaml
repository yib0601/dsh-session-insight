contract_exceptions:
  - rule: "single file <= 400 lines"
    reason: "static dsh.client entry is served as one client.js and the lazy chunks as one client.context.js / client.memory.js; a chunk is reached only through async require.async, so a surface cannot be split across synchronously required files"
    mitigation: "section-separated pure pricing core independently unit-tested; the model-catalog store/helpers are exported to test/model-catalog-client.test.js and executed there; client.memory.js 是 client-memory-src/ 24 个模块按 __ModuleLoader__ 协议装配出来的 chunk（改源码后重新装配并 touch 入口），面板/store/命令解析各自成文件；Host 侧按文件分模块（src/memory/ 单文件均 < 300 行，host/model-sync 同理）且全部可单测；no shared mutable state"
replacement:
  target: "dsh-context v0.59.0 (not installed in this profile; the plugin now owns the surfaces)"
  kept_internal_ids: "tc* slot ids/projection keys stay prefixed so a future co-install cannot collide"
  user_visible_names: "/context command, 「上下文」tab, 「用量总览」overview at the sidebar foot"
