modules:
  - name: pricing
    kind: internal
    responsibility: "官方价目表 + 纯函数算价与金额格式化（逐轮 / 会话累计 / 请求级，CNY/USD 显示）"
    owns: ["client.js#OFFICIAL", "client.js#FREE_MODELS", "client.js#lookupPrice", "client.js#computeTurnCost", "client.js#computeTurnRequestsTotal", "client.js#computeSessionTotal", "client.js#computeRequestsTotal", "client.js#priceBuckets", "client.js#moneyOf", "client.js#formatMoney", "client.js#USD_TO_CNY"]
    exposes: ["PRICING_API (read-only face passed to client.context.js)"]
    depends_on: []
    not_responsible_for: ["会话事件折叠", "UI 渲染", "网络请求"]
  - name: preferences
    kind: internal
    responsibility: "本地偏好（逐轮徽章 / 底部累计显隐、金额币种、DeepSeek 计费时段、会话预算）的持久化外部 store；budget=0 表示不设上限"
    owns: ["client.js#prefs", "client.js#usePrefs", "client.js#PREF_DEFAULTS", "client.js#normalizeBudget"]
    exposes: ["PRICING_API.prefs (same store, consumed by the settings row)"]
    depends_on: ["window.localStorage"]
    not_responsible_for: ["UI 渲染", "Host 配置表单"]
  - name: presentation
    kind: internal
    responsibility: "逐轮徽章（动作行内联；无动作行的轮独占一行，明细按 token 桶给金额）+ 底部状态栏会话累计药丸（有预算时显示 花费/预算 与进度条，超支转红）"
    owns: ["client.js#TurnCostBadge", "client.js#useMessageTurn", "client.js#useTurnTailOf", "client.js#SessionCostPill"]
    exposes: []
    depends_on: ["pricing", "preferences", "react (host module table)", "react-dom (createPortal)", "locale t"]
    not_responsible_for: ["计价口径", "会话状态订阅"]
  - name: composition
    kind: internal
    responsibility: "注册 assistant-actions / turnTail / composer.dock 槽位、locale，并异步加载 context chunk"
    owns: ["client.js#apply"]
    exposes:
      - "conversation.chat.assistant-actions (list, id=turn-cost, order=90)"
      - "conversation.chat.turnTail (list, id=dsh-turn-cost)"
      - "conversation.composer.dock (list, id=session-cost, order=2)"
      - "locale namespace turnCost (zh/en)"
    depends_on: ["presentation", "ctx.slots", "ctx.locale", "ctx.effect"]
    not_responsible_for: ["价格", "组件内部状态"]
  - name: context-host
    kind: internal
    responsibility: "4 个 tc* session 投影（timeline / headers / activity / surface）的纯 fold + 防御式激活；timeline 折叠工具计数 / 命令流水（程序·状态·耗时）/ 文件操作流水与逐文件行数增减 / 用户·助手·技能计数，并记录模型切换事件；activity 按请求时间折叠出 peakBuckets / offPeakBuckets（模型再分一层）；surface 折叠上下文明细（系统提示词分区、每个工具定义各自的估价、消息按类别分桶、占用最大的条目），让「已用 174K」能落到具体条目"
    owns: ["index.js", "host/schema.js", "host/fold.js", "host/surface.js", "host/estimate.js", "host/projections.js"]
    exposes:
      - "projection keys tcTimeline / tcHeaders / tcActivity / tcSurface (framework wire)"
      - "tcSurface = { system: {chars, tokens, sections: [{label, chars, tokens, preview, body, truncated}], seq, time} | null, tools: {seq, time, total, rows: [{name, tokens, chars, description, body, truncated}]} | null, kinds: {[user|assistant|reasoning|call|result|developer|other]: {count, tokens}}, tokens, top: [{seq, time, turn, step, kind, label, tokens, preview}], approximate } (stateVersion 1)；与内置 contextBreakdown 同口径同公式，实测同一会话 systemTokens / toolsTokens / messageTokens 三项逐项相等；body 是给卡片展开读的条目正文，按总预算分配（单段 12K 字符、单条 schema 6K 字符、系统合计 64K、工具合计 80K，按体积从大到小先满足），预算外的条目 body 为空且 truncated=true"
      - "tcTimeline = { requests, events, files, fileOps, commands, toolCalls, counts, last, current } (stateVersion 7); `current` = 会话被设定到的路由 {provider, model, time}（model/selection 与 request/header 都会写，切模型先于计价生效）"
      - "tcActivity.days[*] = { tokens, requests, buckets, peakBuckets, offPeakBuckets, byModel: {model: {peak, offPeak}}, tools, programs, skills } (stateVersion 4)"
    depends_on: ["ctx.sessionProjections"]
    not_responsible_for: ["价格", "UI", "网络请求", "写会话日志", "保留工具输出正文（surface 只留 140 字预览与估价）", "界面文案（label 只放工具名与 kind id）"]
  - name: quota-host
    kind: internal
    responsibility: "订阅额度三条源：DeepSeek 余额（balance_infos → {currency,total,toppedUp,granted}）、OpenCode Go 用量窗口（usage.rolling/weekly/monthly → {key,percent,status,resetsAt}）与 WorkBuddy 积分包（读 shim 的 /quota → {windows:[{key,label,percent,total,remain,resetsAt}],plan,totals}，窗口标签由上游命名）；percent 一律 clamp 0–100；按源缓存 5 分钟（失败不缓存，成功值在失败后继续服务非强制读）、12s 超时，并在 Host web server 上注册 GET /dsh-turn-cost/quota?source=&force=1；密钥按次解析，只留在 Host（WorkBuddy 那条是 shim 的 bearer，不是供应商密钥），端点由 DSH_TURN_COST_WORKBUDDY_QUOTA_URL 配置。是否声明订阅到期由源决定：OpenCode 只有窗口 resetsAt，周期结束由 Client 取最长窗口推出；WorkBuddy 给 plan.expiresAt，Client 直接用，不再推断"
    owns: ["host/quota.js"]
    exposes:
      - "GET /dsh-turn-cost/quota?source=deepseek|opencode-go|workbuddy[&force=1] -> {status: ready|failed|unconfigured, source, kind: balance|windows, available?, wallets?[], windows?[{key,label?,percent,status,resetsAt,total?,remain?}], plan?{name,code,paid,expiresAt}, totals?{total,remain,used,unit}, at, reason?}"
      - "normalizeBalance(payload) / normalizeOpenCodeUsage(payload) / normalizeWorkbuddyQuota(payload) (pure)"
      - "WORKBUDDY_QUOTA_ENDPOINT / KEY_REFS.workbuddy (constants; endpoint overridable by DSH_TURN_COST_WORKBUDDY_QUOTA_URL)"
      - "QUOTA_SOURCES / KEY_REFS / USAGE_WINDOWS / DEFAULT_SOURCE (constants)"
      - "createQuotaReader({cacheMs,timeoutMs,fetch,now}) (pure I/O boundary, cache per source)"
      - "mountQuotaRoute(ctx, reader, readKey) -> route disposer"
    depends_on: ["ctx.webServer", "ctx.credentials (DEEPSEEK_API_KEY / OPENCODE_GO_API_KEY / WORKBUDDY_SHIM_TOKEN)", "网关 shim 的 GET /quota（WorkBuddy 源；本机经 SSH 转发或同机部署）"]
    not_responsible_for: ["计价", "UI 渲染", "充值/告警", "把密钥或原始 payload 交给页面", "落盘缓存", "判断当前会话在用哪个源（Client 依 provider id 决定，不看模型名；provider 已知但无额度则归 NO_SOURCE 并一次都不读，完全认不出则留白）", "把 resetsAt 换算成倒计时文案（Client 做，Host 只透传时刻）", "读 WorkBuddy 供应商计费接口本身（那是 shim 的事，Host 只读 shim 归一后的 envelope）", "把逐模型的免费额度桶混进订阅额度（shim 的 models 字段丢弃，两者语义不同）"]
  - name: model-sync-host
    kind: internal
    responsibility: "让「目录外 provider 路由（自建网关，如 ai-router）的模型清单」跟随网关 /v1/models，且**查看即读、读即核对**：读路由时立即用 profile 里已存的清单应答（那份清单就是选择器本身，因此读永远不等网关），同时按 staleMs（默认 5 分钟）判断是否在后台静默核对一次；核对只在有差异时经 settings 服务整体写回（校验条目 + 落盘 + 重建 provider 一个事务），一致就什么都不写。条目生成覆盖显示名三段式/两段式、输入模态、上下文与输出上限、思考档位与两个 compat 开关，其余字段原样保留。启动延迟 + 定时轮询只作兜底。拉取失败 / 空清单 / 显示名越界（含 router 历史标记）三种情况一个字都不写，宁可保持旧清单"
    owns: ["host/model-sync/naming.js", "host/model-sync/catalog.js", "host/model-sync/listing.js", "host/model-sync/sync.js", "host/model-sync/mount.js"]
    exposes:
      - "GET /dsh-turn-cost/models[?force=1] -> {enabled, route, routes[], settingsNs, baseURL, models[], count, syncedAt, stale, refreshing, last: {at, ok, reason, detail?, count, added, removed} | null, intervalMs, staleMs}（**缓存优先**：普通读立即用已存清单应答、不 await 网关，stale 时在后台核对；force=1 才同步等一轮）"
      - "displayName(id,row) / nameOk(name) / fmtWindow(tokens) (pure)"
      - "buildEntry(id,row,existing) / buildCatalog(rows,stored) / modalitiesOf / reasoningLevelsOf / isGeneratedReasoning (pure)"
      - "listingUrl(baseURL,api) / parseListing(body) / fillMissingPlatforms(rows) / fetchModels(options)"
      - "createModelSync({readTarget,readStored,writeModels,fetchImpl,now,timeoutMs,logger}) -> {run,running,last}"
      - "resolveSyncOptions(env) / mountModelSync(scoped,options) -> {sync,status,stop}"
    depends_on: ["ctx.settings", "ctx.credentials (route 的 apiKeyEnv)", "ctx.webServer (可选，仅状态/目录路由)", "网关 GET /v1/models"]
    not_responsible_for: ["改 DSH 安装树（不打任何补丁、不改 node_modules）", "直接改写 profile 的 cordis.patch.yml（只经 settings.update，让 DSH 校验+落盘+重建 provider 一个事务完成）", "猜能力（行上没声明的模态/档位不写入，保留已有声明）", "替用户手改的 reasoningEfforts/compat 收编（发现非本模块生成的形状就整块不动）", "计价", "UI 渲染（页面/chip 在 context-client）", "把密钥或网关原始 payload 交给页面", "在普通读上阻塞等待网关（只有 force=1 才等）", "决定轮询之外的重试（失败等下一次查看或下个周期）"]
  - name: memory-host
    kind: internal
    responsibility: "项目记忆引擎（原 @yolk_vat-y/dsh-project-memory 的 Host 半边，现为库而非独立插件行）：insight 实体（lesson / decision / procedure / experience，分层去重-强化-提升-容量-归档）、跨会话任务（task 实体 + 宿主 todo 同步）；召回期向每步追加记忆消息（entry 常驻块 + relevance 门控 + 单会话预算），写入侧近重复检测；9 个工具与唯一命令 /tasks（语料索引层关闭：corpusEnabled: false 时不注册 index_repo / index_doc / watch_repo，不跑 watch 与惰性索引，query_memory 只查 insight / experience / task；代码结构归 codegraph、笔记语料归 search_notes）；把同一份能力暴露成宿主 skill 与原生服务 projectMemory，供别的插件消费。所有可选服务缺失都降级（失败点名打日志，不静默）"
    owns:
      - "index.js#Config (memory schema) / index.js#apply (memory 半边)"
      - "src/memory/index.js (toolDefinitions / registerTools / apply)"
      - "src/memory/{chunker,doc-index,doc-pipeline,index-pipeline,index-failures,symbols,enhancer,lazy,watch,recall,auto-inject,inject-visible,insight-store,store,similarity,vector-index,reflection-pipeline,project-profile,project-memory-service,readiness,llm,llm-route,link,ops,global-seed,audit,skill}.js"
      - "src/memory/{tools,commands,util,setup}/"
      - "skills/project-memory/SKILL.md"
      - "skills/project-memory/scripts/pm-digest.mjs"
    exposes:
      - "tools: list_tasks / select_task / archive_task / show_task_panel / query_memory / remember / forget / save_lesson / pm_stats（逐个注册，单个重名或 schema 非法只丢那一个）；index_doc / index_repo / watch_repo 仅在 corpusEnabled: true 时注册"
      - "宿主命令 /tasks（唯一：裸 /tasks 给清单快照，子动词 switch|archive|unbind|rename|todos 与 insight list|confirm|promote|… 由面板按钮经 remote.commands.execute 驱动；不声明 input，裸回车立刻执行）"
      - "宿主 skill project-memory（setupSkill 注册；无 skills 服务则静默跳过）+ scripts/pm-digest.mjs 体检脚本"
      - "原生服务 projectMemory（installProjectMemoryService：别的插件/宿主可经 ctx.get('projectMemory') 消费召回与写入；老宿主无 ctx.provide 时安全跳过）"
      - "agent/pre-step 注入（installAutoInject：默认开，无项目 root 可解析时零副作用，异常交回默认决策）"
      - "Config（bundle 行唯一配置面：memoryDir / chunkChars / maxFileSizeMb / lazyIndexing / watch / autoIndexOnFirstUse / watchInterval / roots.* / insight.* / reflection.* / autoContext.* / tasklist.*）；volatile 字段只有 autoIndexOnFirstUse / watchInterval / llmQueryExpansion"
      - "磁盘契约：<root>/.dsh-project-memory/（索引、insight、任务、审计与影子日志），单项目日志硬上限 2×shadowMaxBytes + 2×auditMaxBytes"
    depends_on: ["ctx.tools", "ctx.commands (可选)", "ctx.skills (可选)", "ctx.llm (可选，召回期查询扩展/反思)", "ctx.session (session/event · session/disposed)", "ctx.provide (可选)", ".dsh-project-memory/ 与项目工作目录"]
    not_responsible_for: ["计价 / token 统计 / 上下文投影（成本半边的事）", "UI 渲染（面板与设置页在 memory-client）", "索引期调用 LLM（索引全本地；LLM 只出现在召回期查询扩展与反思，且默认关）", "扫描家目录 / 文件系统根 / 系统目录（assertSafeRoot 默认拒绝，roots.allow 才放行）", "在 DSH 安装树里打补丁或改写会话日志", "把索引正文塞进 prompt（注入只带摘要与引用）"]
  - name: memory-client
    kind: internal
    responsibility: "项目记忆的界面半边（懒加载兄弟 chunk）：任务面板（shell.overlay 浮层，任务页 / 记忆页 / 新建条目表单 / 分页 / 拖拽），会话内 /tasks 命令节点（接管内置大段文本卡片，避免 JSON 载荷刷屏），show_task_panel 的工具视图（结果一渲染就开面板 —— 面板状态只在浏览器侧），`/` 菜单「工作流」斜杠源（纯客户端开面板页，不发宿主命令），以及设置面板的「记忆与笔记」页（settings.section，id project-memory：记忆三个 volatile 字段经 configForms 宿主校验 + revision fence 原地生效，笔记三项走嵌套路径 mutate）。全部软依赖：slots / configForms / locale / inputTriggers 缺任一项只降级成一条点名告警，绝不静默消失"
    owns: ["client.memory.js", "client-memory-src/"]
    exposes:
      - "shell.overlay (list, id=dsh-project-memory-task-panel, order=100)"
      - "conversation.chat.commandview (keyed, key=tasks)"
      - "tool.call.toolview (keyed, key=show_task_panel)"
      - "inputTriggers source project-memory (line /，order 1，组标题由行上的 section 取代)"
      - "settings.section (list, id=project-memory, order=32, locale dsh-project-memory.settings)"
      - "settings.section.icon (list, id=project-memory, order=32)"
      - "locale namespace dsh-project-memory.settings (zh/en)"
    depends_on: ["ctx.slots (shell.overlay / conversation.chat.commandview / tool.call.toolview)", "ctx.configForms + ctx.locale (设置页)", "ctx.inject(inputTriggers, sessions)", "react (宿主模块表)", "memory-host 的工具与 remote.commands（只在动作上，非装配依赖）", "client.js 的 require.async 装载"]
    not_responsible_for: ["索引 / 召回 / 注入策略（memory-host）", "直接读写 .dsh-project-memory/（面板只走工具与 remote）", "成本 / 额度 / 上下文界面（client.js 与 client.context.js）", "早退式降级（缺服务也必须挂载并说明原因）"]
  - name: context-items
    kind: internal
    responsibility: "上下文明细的估价口径：DSH 固定密度启发式（4 字符 ≈ 1 token、每块 4 token framing、每条消息 4 token 角色开销）+ 三种明细切分（系统提示词按标题/规则线/【…】标签分区、工具定义逐条按 JSON 体积估价、压缩区间按 shadow price 回撤）"
    owns: ["host/estimate.js", "host/surface.js"]
    exposes: ["estimateMessage / estimateContent / estimateSystemMessage / estimateToolsTokens / systemSectionsOf / toolRowsOf / systemTextOf (pure)"]
    depends_on: []
    not_responsible_for: ["真实分词", "供应商上报用量", "UI 渲染", "无限量保留正文（按总预算分配，超出截断并标记）"]
  - name: context-client
    kind: internal
    responsibility: "5 个界面入口 + 设计系统（宿主 --dsw-* token）+ 卡片与仪表盘；上下文明细的四层视觉层级（整窗摘要条 → 页签含条目计数 → 本页签量级行 → 带列头的条目行，量级条相对最大行、占比相对本页签总量，头名行加强、摘要列去装饰，容器查询降级：≤820px 去摘要列、≤460px 去量级条）；含上下文统计（计数 + 工具/程序分布）、命令执行流水、文件活动（类型筛选/路径搜索/行数增减/操作日志）、Token 环形图、事件类型筛选、按模型花费、逐请求筛选/排序/CSV/分页/请求内容展开（来自页面内存里的聊天快照，不落盘）、Agent 家族卡（父/己/子/孙，各自 tokens 与费用）、仪表盘时间范围与工具/程序/技能排行、7 日柱图数值标签、预算行；侧栏脚额度卡（标题 + 订阅倒计时徽标 + 三条窗口计量条，折叠成 36px 导轨时收成一枚百分比/倒计时方块，倒计时按最长窗口 resetsAt 取整、≤7 天黄 ≤3 天红）；跨会话聚合 useMemo 缓存，历史金额按投影里的 peak / offPeak 桶分档计价"
    owns: ["client.context.js"]
    exposes:
      - "conversation.view (list, id=tc-context, order=20)"
      - "settings.section (list, id=turn-cost, order=30；id=tc-models, order=31 模型目录)"
      - "settings.action (list, id=tc-models-chip, order=20 — 设置面板打开即挂载，是模型目录的惰性触发器)"
      - "settings.section.icon (list, id=turn-cost, order=30)"
      - "conversation.input.overlay (list, id=tc-context-modal, order=20)"
      - "sidebar.footer.action (list, id=tc-overview, order=20)"
      - "sidebar.right.pane.tab (keyed, key=tc-context)"
      - "inputTriggers source context (line /context)"
      - "locale namespace tcContext (zh/en)"
    depends_on: ["pricing face", "react", "react-dom", "ctx.slots", "ctx.locale", "ctx.inject(inputTriggers/sidebarRightTabs)", "quota-host route (HTTP only)"]
    not_responsible_for: ["价格计算", "会话事件折叠"]

dependency_direction: "composition -> presentation -> pricing; context-client -> pricing face; context-client -> projections (read-only); context-client -> quota-host / model-sync-host over same-origin HTTP routes (no import); model-sync-host -> naming -> catalog -> listing (pure chain, one direction); index.js 只做注入与挂载，不碰 model-sync 内部; 记忆半边与成本半边在装配期互不引用（index.js 分别 try/catch 挂载，一边失败不连坐另一边）: memory-client -> memory-host 只经工具与 remote.commands，不 import Host 代码; memory-host -> src/memory/util -> 存储目录，单向"
forbidden:
  - "跨模块引用 internal 实现"
  - "反向或循环依赖"
  - "共享可变全局状态"
  - "使用第三方价格表（models.dev / pi-ai catalog）"
  - "在 client 中 require Harness Client 包"
  - "写 Session 事件或读取原始会话日志文件"
  - "让供应商密钥或官方原始 payload 进入页面"
  - "把余额缓存到磁盘"
  - "在 DSH 安装树（node_modules / lib）里打补丁，或绕过 settings 服务直接写 profile 配置"
  - "在行上没有声明时给模型补能力（模态、思考档位）——宁缺毋滥"
public_slots:
  - key: conversation.chat.assistant-actions
    kind: list
    scope: session
    id: turn-cost
    order: 90
    locale: turnCost
  - key: conversation.chat.turnTail
    kind: list
    scope: session
    id: dsh-turn-cost
    order: 90
    locale: turnCost
  - key: conversation.composer.dock
    kind: list
    scope: session
    id: session-cost
    order: 2
    locale: turnCost
  - key: conversation.view
    kind: list
    scope: session
    id: tc-context
    order: 20
    locale: tcContext
  - key: conversation.input.overlay
    kind: list
    scope: session
    id: tc-context-modal
    order: 20
    locale: tcContext
  - key: sidebar.footer.action
    kind: list
    scope: root
    id: tc-overview
